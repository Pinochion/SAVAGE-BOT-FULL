name: Validate Python

on:
  push:
    branches: [rewrite-v2]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "import cogs.admin_panel, cogs.admin_tools, cogs.contracts, cogs.reactions, cogs.tickets, cogs.warns"
      - run: python -c "import os, tempfile; os.environ['DATA_DIR']=tempfile.mkdtemp(); from utils.config_db import init_config_database, get_config, set_value; init_config_database(); set_value(123, 'group_admin_role_ids', '456,789'); assert get_config(123)['group_admin_role_ids']=='456,789'; print('database migration OK')"

  ui-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [admin, tickets, contracts, reactions, voice]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python tests/smoke_views.py ${{ matrix.group }}
